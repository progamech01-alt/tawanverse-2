name: Restore uploaded source structure
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-uploaded-source
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Remove verified duplicate uploads
        shell: python
        run: |
          from pathlib import Path
          required = ['src/app/page.tsx', 'src/app/layout.tsx', 'tests/ai.test.ts', 'tests/domain.test.ts']
          assert all(Path(p).is_file() for p in required), 'Required source files are missing'
          canonical = {p.read_bytes() for folder in ['src','public','scripts','sql','supabase','tests'] for p in Path(folder).rglob('*') if p.is_file()}
          for p in Path('.').iterdir():
              if p.is_file() and p.suffix in ['.ts','.tsx'] and p.name not in ['next-env.d.ts','next.config.ts']:
                  assert p.read_bytes() in canonical, f'Unmatched source: {p}; refusing to delete'
          for old,new in [('env.example','.env.example'),('download','.gitignore'),('download (1)','.htaccess')]:
              a,b = Path(old),Path(new)
              if a.exists() and not b.exists():
                  b.write_bytes(a.read_bytes())
              if b.exists():
                  canonical.add(b.read_bytes())
          duplicates = [p for p in Path('.').iterdir() if p.is_file() and not p.name.startswith('.') and p.read_bytes() in canonical]
          for p in duplicates:
              p.unlink()
          Path('tsconfig.tsbuildinfo').unlink(missing_ok=True)
          print(f'Removed {len(duplicates)} verified duplicate uploads; kept existing organized files unchanged.')
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Commit verified repair
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Remove duplicate root files after restoring source directories"
          git push origin HEAD:main
